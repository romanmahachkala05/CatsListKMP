name: CI

on:
  # Every pull request, whatever it targets. Filtering by base branch reads as an
  # economy and behaves as a hole: a stacked PR — one based on the branch below it
  # rather than on dev — matched nothing and ran no checks at all (ADR-0034).
  pull_request:
  # dev and main themselves are verified too, so a bad merge is caught even when
  # every PR into them was green on its own base.
  push:
    branches: [dev, main]

# A new push supersedes the run it interrupted; nothing is learned from finishing
# the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home and the configuration cache between runs.
      - uses: gradle/actions/setup-gradle@v6

      # gradlew is committed without the executable bit, which Linux needs.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # The same task a developer runs locally — one definition of the gate,
      # so a red check here can be reproduced without translating YAML back
      # into Gradle tasks. See docs/DECISIONS.md ADR-0018.
      - name: Verify
        # --stacktrace: a worker failure otherwise reports only the task name, with no cause.
        run: ./gradlew verify --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  # Kotlin/Native compiles for iOS only on macOS, so the Linux job above skips those targets.
  # This one builds them and runs their tests on a simulator: the only check of iOS between
  # sessions on the Mac.
  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native toolchain and its LLVM, about a gigabyte fetched on first use.
      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # Every module's tests on the simulator, the device target compiled, and the framework
      # the iOS app links.
      - name: Build and test for iOS
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/iosSimulatorArm64Test/'
          retention-days: 7
