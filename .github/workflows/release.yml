name: Release

on:
  # A version tag builds everything and drafts the GitHub release; a person publishes it.
  push:
    tags: ['v*']
  # Packaging breaks in ways `verify` cannot see — a missing JDK module, a bad icon, a jpackage
  # quirk on one OS — so a pull request that touches it builds the installers too, long before
  # a tag depends on them.
  pull_request:
    paths:
      - 'desktopApp/**'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    # jpackage builds only for the OS it runs on, so each installer needs its own runner.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # MSI on Windows, DMG on macOS, DEB on Linux (desktopApp/build.gradle.kts).
      - name: Package
        # bash on every OS, Windows included, so the wrapper call is written once.
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # Signed when the repository holds the keystore secrets (RELEASING.md); otherwise the
      # build still succeeds and the APK is unsigned, which the draft release makes visible.
      - name: Assemble the release APK
        env:
          CATSLIST_STOREFILE: ${{ secrets.CATSLIST_STOREFILE }}
          CATSLIST_STOREPASSWORD: ${{ secrets.CATSLIST_STOREPASSWORD }}
          CATSLIST_KEYALIAS: ${{ secrets.CATSLIST_KEYALIAS }}
          CATSLIST_KEYPASSWORD: ${{ secrets.CATSLIST_KEYPASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # A draft: the notes and the files get a human look before anyone can download them.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "CatsList $GITHUB_REF_NAME"
