// Classes the Compose compiler cannot infer stability for, declared stable by hand.
//
// Everything here is a promise the compiler takes at its word, so each line needs a reason why
// the promise is true. See ADR-0033 — and `-Pcatslist.composeMetrics`, which is how to check
// whether a line here is still doing anything.

// :core:model is a pure-Kotlin module with no Compose compiler on it, so nothing in it carries
// stability metadata and every class is assumed unstable. Cat is an immutable data class of
// String/Int/Boolean; the assumption is wrong and it costs every card in the feed its skipping.
com.example.catslist.domain.model.Cat

// Paging's load state. A sealed type whose Error case holds a Throwable — unstable by
// inference, immutable in fact: Paging builds a new instance per transition and never mutates
// one. Without this, EmptyFeed compares its parameter by identity and recomposes on every pass.
androidx.paging.LoadState
